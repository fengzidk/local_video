<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>播放详情</title>
  <script src="https://unpkg.com/vue@2.7.16/dist/vue.js"></script>
  <style>
    :root { --bg:#0f1115; --text:#e6e9ef; --muted:#9aa4b2; --accent:#5b9cff; --card:#1a1f29; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;}
    header { position:sticky; top:0; z-index:10; background:linear-gradient(180deg, rgba(15,17,21,.9), rgba(15,17,21,.7)); backdrop-filter: blur(6px); padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,.06); display:flex; align-items:center; gap:10px;}
    header h1 { margin:0; font-size:18px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    header .back { background: transparent; color: var(--text); border:1px solid rgba(255,255,255,.2); padding:6px 10px; border-radius:8px; }
    .container { padding: 12px; }
    .player {
      position: relative;
      background: #000; border-radius: 12px; overflow:hidden; box-shadow: 0 6px 18px rgba(0,0,0,.25);
    }
    video { width: 100%; height: auto; max-height: 70vh; display:block; }
    /* Visible icon buttons for seek (-10s left, +10s right). Single tap = ±10s,
       long-press repeats every 200ms. Buttons sit above the native control bar so
       play/pause and scrubber remain reachable. The left button avoids the top-left
       corner where iPad Chrome renders native fullscreen / AirPlay / PiP icons. */
    .seek-btn {
      position:absolute; top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,.45); color:#fff; border:none;
      width: 56px; height: 56px; border-radius: 28px;
      display:flex; align-items:center; justify-content:center;
      font-size: 26px; line-height:1;
      backdrop-filter: blur(4px);
      -webkit-tap-highlight-color: transparent;
      user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
      touch-action: manipulation;
      cursor:pointer; z-index: 4;
    }
    .seek-btn:active { background: rgba(0,0,0,.7); transform: translateY(-50%) scale(.95); }
    .seek-btn-left  { left: 12px; }
    .seek-btn-right { right: 12px; }
    .controls { display:flex; flex-wrap:wrap; gap:8px; padding:10px; background:var(--card); border-radius:12px; margin-top:10px; align-items:center; }
    .chip { background: #252b37; color: var(--text); border:none; padding:6px 10px; border-radius:999px; font-size:12px; }
    .chip.active { background: var(--accent); }
    .rec { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { color: var(--muted); font-size:12px; }
    .res-group { display:flex; gap:4px; align-items:center; }
    .res-label { color:var(--muted); font-size:12px; white-space:nowrap; }
    .btn-danger { background: #e05252; color:#fff; border:none; padding:6px 14px; border-radius:8px; font-size:13px; cursor:pointer; }
    .btn-danger:hover { background: #c43a3a; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <button class="back" @click="goBack">返回</button>
      <h1>{{ name }}</h1>
      <button class="btn-danger" @click="confirmDelete">删除</button>
    </header>
    <div class="container">
      <div class="player">
        <video ref="player" controls playsinline webkit-playsinline autoplay muted :src="mediaUrl"></video>
        <button class="seek-btn seek-btn-left"
                aria-label="后退10秒"
                @pointerdown.prevent="onSeekPress(-10, $event)"
                @pointerup="onSeekRelease"
                @pointerleave="onSeekRelease"
                @pointercancel="onSeekRelease"
                @contextmenu.prevent>⏪</button>
        <button class="seek-btn seek-btn-right"
                aria-label="前进10秒"
                @pointerdown.prevent="onSeekPress(10, $event)"
                @pointerup="onSeekRelease"
                @pointerleave="onSeekRelease"
                @pointercancel="onSeekRelease"
                @contextmenu.prevent>⏩</button>
      </div>
      <div class="controls">
        <!-- Speed buttons removed as requested -->
        <div class="rec">
          <div class="res-group">
            <span class="res-label">倍速：</span>
            <button v-for="s in speedOptions" :key="s"
              class="chip" :class="{active: speed===s}"
              @click="setSpeed(s)">{{ s }}x</button>
          </div>
          <button class="chip" :class="{active: recordMode==='clip'}" @click="toggleClip">
            🎬 导出视频
          </button>
          <button class="chip" :class="{active: recordMode==='gif'}" @click="toggleGif">
            🖼 导出GIF
          </button>
          <div class="res-group">
            <span class="res-label">分辨率：</span>
            <button v-for="r in resOptions" :key="r.value"
              class="chip" :class="{active: exportWidth===r.value}"
              @click="exportWidth=r.value">{{ r.label }}</button>
          </div>
          <span class="badge" v-if="recordMode">已标记起点 {{ startTime.toFixed(2) }}s，再次点击结束</span>
        </div>
      </div>
      <div class="controls" v-if="downloadUrl">
        <span class="badge">已生成：</span>
        <a :href="downloadUrl" target="_blank">{{ downloadUrl }}</a>
        <button class="chip" @click="saveNow">保存到设备</button>
      </div>
    </div>

  </div>
  <script>
    function getQuery(k){ const u=new URL(window.location.href); return u.searchParams.get(k)||''; }
    new Vue({
      el: '#app',
      data(){
        return {
          path: decodeURIComponent(getQuery('path')),
          name: decodeURIComponent(getQuery('name')) || '播放详情',
          speedOptions: [1.25, 1.5, 2, 3, 5],
          speed: 1,
          startTime: 0,
          endTime: 0,
          downloadUrl: '',
          recordMode: null,
          metaLoaded: false,
          deleting: false,
          seekHoldStartTimer: null,
          seekHoldTimer: null,
          seekHoldFired: false,
          exportWidth: 0,
          resOptions: [
            { label: '720p', value: 1280 },
            { label: '1080p', value: 1920 },
            { label: '原始', value: 0 },
          ],
        };
      },
      computed:{
        mediaUrl(){
          return '/media/' + this.path.replace(/\\/g, '/').split('/').map(encodeURIComponent).join('/');
        },
        canExport(){ return this.endTime > this.startTime; }
      },
      mounted(){
        const v = this.$refs.player;
        v.addEventListener('error', this.onPlaybackError);
        v.addEventListener('loadedmetadata', ()=>{
          this.metaLoaded = true;
          // 尝试播放后再延迟解除静音，避免 iPad/iOS 立即取消静音导致暂停
          v.play().then(()=> this.tryUnmute()).catch(()=>{
            // 自动播放被拒绝时保持静音继续尝试播放
            v.play().catch(()=>{}).finally(()=> this.tryUnmute());
          });
        });
        // 立即尝试自动播放（先静音以绕过浏览器限制），元数据就绪后再解除静音
        v.play().catch(()=>{});
        // Auto-resume on fullscreen exit (iPad WebKit pauses video when leaving native fullscreen)
        v.addEventListener('webkitendfullscreen', this.onFullscreenExit);
        document.addEventListener('fullscreenchange', this.onDocFullscreenChange);
        document.addEventListener('webkitfullscreenchange', this.onDocFullscreenChange);
      },
      methods:{
        goBack(){ history.length>1 ? history.back() : window.location.href='/' },
        tryUnmute(){
          const v = this.$refs.player;
          if (!v) return;
          // iOS/iPad: 立即取消静音可能导致播放停止；延迟后再操作并校验状态
          setTimeout(()=>{
            if (!v) return;
            const wasPlaying = !v.paused;
            v.muted = false;
            // 取消静音后若被暂停（典型 iOS 行为），回滚为静音并继续播放
            setTimeout(()=>{
              if (wasPlaying && v.paused && !v.ended){
                v.muted = true;
                v.play().catch(()=>{});
              }
            }, 60);
          }, 300);
        },
        confirmDelete(){
          if (this.deleting) return;
          const ok = window.confirm('确认删除该文件？\n' + this.name + '\n此操作不可恢复。');
          if (!ok) return;
          this.doDelete();
        },
        async doDelete(){
          if (this.deleting) return;
          this.deleting = true;
          try {
            const r = await fetch('/api/video?path=' + encodeURIComponent(this.path), { method: 'DELETE' });
            if (r.ok || r.status === 204) {
              // 通知列表页移除该视频
              sessionStorage.setItem('deleted_path', this.path);
              window.location.href = '/';
            } else {
              const d = await r.json().catch(()=>({}));
              window.alert('删除失败：' + (d.error || r.status));
              this.deleting = false;
            }
          } catch(e) {
            window.alert('删除失败：' + e.message);
            this.deleting = false;
          }
        },
        onSeekPress(delta, e){
          if (e && e.target && e.target.setPointerCapture && e.pointerId != null){
            try { e.target.setPointerCapture(e.pointerId); } catch(_){}
          }
          this.seekHoldFired = false;
          this.seek(delta);
          this.clearSeekHold();
          this.seekHoldStartTimer = setTimeout(()=>{
            this.seekHoldFired = true;
            this.seekHoldTimer = setInterval(()=>{ this.seek(delta); }, 200);
          }, 400);
        },
        onSeekRelease(){
          this.clearSeekHold();
        },
        clearSeekHold(){
          if (this.seekHoldStartTimer){ clearTimeout(this.seekHoldStartTimer); this.seekHoldStartTimer = null; }
          if (this.seekHoldTimer){ clearInterval(this.seekHoldTimer); this.seekHoldTimer = null; }
        },
        onFullscreenExit(){
          // iPad WebKit auto-pauses on native fullscreen exit; resume if not ended
          const v = this.$refs.player;
          if (!v) return;
          setTimeout(()=>{
            if (v.paused && !v.ended){
              v.play().catch(()=>{});
            }
          }, 50);
        },
        onDocFullscreenChange(){
          const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
          if (!fsEl){
            // Exiting fullscreen - ensure playback continues
            this.onFullscreenExit();
          }
        },
        setSpeed(s){
          const v = this.$refs.player;
          // Toggle off when clicking the active chip -> back to 1x
          const next = (this.speed === s) ? 1 : s;
          this.speed = next;
          if (v) v.playbackRate = next;
        },
        onPlaybackError(){
          this.requestPlayable();
        },
        async requestPlayable(){
          try {
            const r = await fetch('/api/transcode', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ path: this.path })});
            const d = await r.json();
            this.compatUrl = d.url;
            const v = this.$refs.player;
            v.src = d.url;
            v.play().catch(()=>{});
          } catch(e) {}
        },
        seek(delta){
          const v = this.$refs.player;
          const nt = Math.max(0, Math.min((v.duration||v.currentTime+delta), v.currentTime + delta));
          v.currentTime = nt;
        },
        toggleClip(){
          const v = this.$refs.player;
          if (this.recordMode === 'clip'){
            this.endTime = Math.max(v.currentTime, this.startTime + 0.2);
            this.exportClip();
            this.recordMode = null;
          } else {
            this.startTime = v.currentTime;
            this.endTime = this.startTime;
            this.recordMode = 'clip';
          }
        },
        toggleGif(){
          const v = this.$refs.player;
          if (this.recordMode === 'gif'){
            this.endTime = Math.max(v.currentTime, this.startTime + 0.2);
            this.exportGif();
            this.recordMode = null;
          } else {
            this.startTime = v.currentTime;
            this.endTime = this.startTime;
            this.recordMode = 'gif';
          }
        },
        async exportClip(){
          const body = { path: this.path, start: this.startTime, end: this.endTime, width: this.exportWidth };
          const r = await fetch('/api/clip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
          if (!r.ok) { const e = await r.json().catch(()=>({})); alert('导出视频失败: '+(e.error||r.status)); return; }
          const d = await r.json();
          const name = d && d.name ? d.name : (this.safeBaseName(this.name) + '-clip.mp4');
          this.downloadUrl = `/api/download/clip?name=${encodeURIComponent(name)}`;
          this.saveToDevice(this.downloadUrl, name);
        },
        async exportGif(){
          const duration = Math.min(this.endTime - this.startTime, 20);
          const body = { path: this.path, start: this.startTime, duration, width: this.exportWidth };
          const r = await fetch('/api/gif', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
          if (!r.ok) { const e = await r.json().catch(()=>({})); alert('导出GIF失败: '+(e.error||r.status)); return; }
          const d = await r.json();
          const name = d && d.name ? d.name : (this.safeBaseName(this.name) + '-clip.gif');
          this.downloadUrl = `/api/download/gif?name=${encodeURIComponent(name)}`;
          this.saveToDevice(this.downloadUrl, name);
        },
        saveToDevice(url, filename){
          const a = document.createElement('a');
          a.href = url;
          a.download = filename || '';
          a.style.display = 'none';
          document.body.appendChild(a);
          try { a.click(); } catch(e) {}
          setTimeout(()=>{ document.body.removeChild(a); }, 0);
        },
        saveNow(){
          if (!this.downloadUrl) return;
          const name = this.downloadUrl.includes('/clip?') ? (this.name.replace(/\.[^/.]+$/, '') + '-clip.mp4') : (this.name.replace(/\.[^/.]+$/, '') + '-clip.gif');
          this.saveToDevice(this.downloadUrl, name);
        },
        safeBaseName(n){ return (n||'video').replace(/\.[^/.]+$/, ''); },
      }
    });
  </script>
</body>
</html>
